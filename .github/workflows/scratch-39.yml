# TEMPORARY (#39): quick Windows iteration on the Credential Manager and notification tests. Removed before hand-off.
name: scratch-39

on:
  push:
    branches: ["spec5/39-*"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diagnostics
        shell: powershell
        run: |
          $null = [Windows.UI.Notifications.ToastNotificationManager, Windows.UI.Notifications, ContentType = WindowsRuntime]
          $null = [Windows.UI.Notifications.NotificationSetting, Windows.UI.Notifications, ContentType = WindowsRuntime]
          $n = [Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier('{1AC14E77-02E7-4E5D-B744-2EB1AE5198B7}\WindowsPowerShell\v1.0\powershell.exe')
          try { "ps setting: [$($n.get_Setting())]" } catch { "ps setting threw: $($_.Exception.ToString())" }
          $key = 'HKCU:\Software\Classes\AppUserModelId\dev.jarvis.diag'
          $null = New-Item -Path $key -Force
          $null = New-ItemProperty -LiteralPath $key -Name DisplayName -Value 'Jarvis diag' -PropertyType String -Force
          $m = [Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier('dev.jarvis.diag')
          try { "registered setting: [$($m.get_Setting())]" } catch { "registered setting threw: $($_.Exception.ToString())" }
          $u = [Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier('dev.jarvis.unregistered')
          try { "unregistered setting: [$($u.get_Setting())]" } catch { "unregistered setting threw: $($_.Exception.ToString())" }
          Set-StrictMode -Version Latest
          try { $x = $m.Setting; "strict registered: [$x]" } catch { "strict threw: $($_.Exception.ToString())" }
      - name: Windows desktop tests
        if: ${{ !cancelled() }}
        env:
          JARVIS_TEST_REAL_DESKTOP: "1"
        run: pnpm vitest run apps/service/test/windows-desktop-real.test.ts apps/service/test/windows-desktop.test.ts apps/service/test/private-state-files.test.ts
