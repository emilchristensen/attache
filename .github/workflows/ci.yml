# The same checks as `pnpm lint`, `pnpm typecheck`, `pnpm test` and `pnpm e2e` locally,
# on macOS and Linux. The job names are the required status checks on `main`.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Each check runs even when an earlier one failed, so one run shows every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint --max-warnings 0

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      # The Linux secret store and notifications against GNOME Keyring and dunst in a throwaway desktop session.
      - name: Linux desktop session tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Linux' }}
        env:
          JARVIS_TEST_REAL_DESKTOP: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus dbus-x11 gnome-keyring libsecret-tools libnotify-bin dunst xvfb xauth
          sh scripts/linux-desktop-session.sh pnpm vitest run apps/service/test/linux-desktop-real.test.ts

      # The journeys use the installed Google Chrome channel (playwright.config.ts).
      - name: Google Chrome
        id: chrome
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install chrome

      - name: Browser journeys
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        run: pnpm e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
