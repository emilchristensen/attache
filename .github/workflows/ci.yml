# The same checks as `pnpm lint`, `pnpm typecheck`, `pnpm test` and `pnpm e2e` locally,
# on macOS, Linux and Windows on the minimum supported Node (engines.node in package.json),
# on Linux also on the current Node release, and the install test on macOS, Linux and Windows.
# `checks (<os>)` and `journeys (<os>)`, the jobs on the minimum Node, are the required status checks on `main`.
#
# The jobs split by event, so a branch with a pull request runs each job once:
# - every push runs the Linux jobs;
# - a pull request that is not a draft runs the macOS and Windows jobs, on the commit it would merge;
# - a run started by hand runs every job;
# - every night at 23:15 UTC the checks run on Linux on main, so a test or a feature that breaks
#   in the last hour before midnight (UTC is the runners' time zone) fails before anyone pushes then.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.node == 'minimum' && format('checks ({0})', matrix.os) || format('checks ({0}, current Node)', matrix.os) }}
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'schedule') && '["ubuntu-latest"]' || github.event_name == 'pull_request' && '["macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        node: [minimum, current]
        exclude:
          - { os: macos-latest, node: current }
          - { os: windows-latest, node: current }
    runs-on: ${{ matrix.os }}
    # A healthy Windows run takes about 16 minutes (unit tests 8 to 13), so the limit leaves room for a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up the workspace
        id: setup
        uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node }}

      # Each check runs even when an earlier one failed, so one run shows every failure.
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint --max-warnings 0

      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm typecheck

      - name: Unit and integration tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test

      # The Linux secret store and notifications against GNOME Keyring and dunst in a throwaway desktop session.
      - name: Linux desktop session tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        # A mirror outage must fail this step, not hang the job until its own timeout.
        timeout-minutes: 10
        env:
          ATTACHE_TEST_REAL_DESKTOP: "1"
        # apt-get runs under its own time limit: the step's limit stops the shell but not a sudo apt-get,
        # which then holds the package lock and fails the next apt-get or Chrome install on this runner.
        run: |
          sudo timeout 3m apt-get -o Acquire::Retries=3 update
          sudo timeout 5m apt-get -o Acquire::Retries=3 install -y --no-install-recommends dbus dbus-x11 gnome-keyring libsecret-tools libnotify-bin dunst xvfb xauth
          sh scripts/linux-desktop-session.sh pnpm vitest run apps/service/test/linux-desktop-real.test.ts

      # The Windows secret store and notifications against Credential Manager and Windows notifications.
      - name: Windows desktop tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 10
        env:
          ATTACHE_TEST_REAL_DESKTOP: "1"
        run: pnpm vitest run apps/service/test/windows-desktop-real.test.ts

      # The logs the test services wrote in their temporary state folders.
      - name: Collect service logs
        if: failure()
        run: node scripts/collect-service-logs.mjs

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The browser journeys in their own job, beside `checks` on the same machines, so neither job runs near its limit.
  journeys:
    name: ${{ matrix.node == 'minimum' && format('journeys ({0})', matrix.os) || format('journeys ({0}, current Node)', matrix.os) }}
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'schedule') && '["ubuntu-latest"]' || github.event_name == 'pull_request' && '["macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        node: [minimum, current]
        exclude:
          - { os: macos-latest, node: current }
          - { os: windows-latest, node: current }
    runs-on: ${{ matrix.os }}
    # A healthy Windows run takes about 19 minutes (the journeys 13 to 15), so the limit leaves room for a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup
        with:
          node: ${{ matrix.node }}

      # The journeys use the installed Google Chrome channel (playwright.config.ts).
      - name: Google Chrome
        run: npx playwright install chrome

      - name: Browser journeys
        run: pnpm e2e

      # The logs the test services wrote in their temporary state folders.
      - name: Collect service logs
        if: failure()
        run: node scripts/collect-service-logs.mjs

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-results-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Builds two releases for this computer, signed with a test key, and installs, upgrades, backs up,
  # restores and uninstalls them in a clean profile (scripts/test-install.mjs). macos-latest is Apple silicon.
  install:
    name: install (${{ matrix.os }})
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || github.event_name == 'pull_request' && '["macos-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # The test opens the installer's pairing link in the installed Google Chrome channel.
      - name: Google Chrome
        run: npx playwright install chrome

      # A CI job has no login session, so it has no systemd user manager.
      # Lingering starts one for the runner user, as logging in would.
      - name: systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do
            [ -S "/run/user/$(id -u)/bus" ] && exit 0
            sleep 1
          done
          echo "the systemd user manager did not start" >&2
          exit 1

      - name: Install test
        run: node scripts/test-install.mjs --from 0.1.0 --to 0.1.1

      # The install test keeps the installed service's logs in test-results/install-logs when a check fails;
      # a test that crashed leaves them in its temporary home folder.
      - name: Collect service logs
        if: failure()
        run: node scripts/collect-service-logs.mjs

      - name: Upload install results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-results-${{ matrix.os }}
          path: |
            test-results/install-results.json
            test-results/install-logs/
            test-results/service-logs/
          retention-days: 7
          if-no-files-found: ignore
