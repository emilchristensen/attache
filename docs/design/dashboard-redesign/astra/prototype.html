<style>

}.brief small{font:13px system-ui}.coverage{border:1px solid var(--line);padding:14px 18px;border-radius:6px;margin:24px 0;color:var(--warn)}.item{padding:18px 0;border-bottom:1px solid var(--line)}.item:first-child{padding-top:0}.item p{margin:5px 0 10px}.pill{font-size:12px;padding:4px 8px;border-radius:4px;background:var(--wash);color:var(--accent)}.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;margin-top:24px}.list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px}.list button.selected{background:var(--wash)}.list small{display:block;margin-top:7px}textarea,input{width:100%;padding:13px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:5px}textarea{min-height:190px;line-height:1.6}.label{display:block;font-size:13px;color:var(--muted);margin:18px 0 6px}.quote{border-left:3px solid #ba6249;padding:10px 18px;background:var(--bg);margin:18px 0}.facts{display:grid;grid-template-columns:130px 1fr;gap:14px;border-top:1px solid var(--line);padding:20px 0}.section{margin-top:30px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{border-radius:30px}.notice{position:fixed;bottom:18px;left:calc(50% + 80px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:8px;max-width:80%;box-shadow:0 4px 20px #0002}.notice:empty{display:none}progress{width:100%;accent-color:var(--accent)}details{margin:15px 0}summary{cursor:pointer;min-height:44px;padding:10px 0}.skip{position:absolute;top:-80px}.skip:focus{top:0}.secondary{font-size:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}

<script>
const b=(label,code="demo(this.textContent)")=>'<button onclick="'+code+'">'+label+'</button>';
const primary=(label,code)=>'<button class="primary" onclick="'+(code||"demo(this.textContent)")+'">'+label+'</button>';
const header=(tag,title,desc)=>'<div class="eyebrow">'+tag+'</div><h1>'+title+'</h1><p class="lead">'+desc+'</p>';
const item=(tag,title,desc,actions='')=>'<article class="item"><small>'+tag+'</small><h3>'+title+'</h3><p class="muted">'+desc+'</p><div class="row">'+actions+'</div></article>';
const pages={
Home:()=>header('Tuesday, 17 November','Your day, in view.','4 attention items from your connected sources. One source needs another look.')+'<div class="grid"><section class="paper brief"><div class="row spread"><span class="eyebrow">Morning briefing</span><small>Prepared 08:40</small></div><p>The launch review is waiting for your judgment. Mira needs a reply before Thursday, and your project checkpoint starts at 14:00.</p><p>The rollout date in the Brain is past its Review date.</p><div class="row">'+b('Read full briefing')+b('Prepare briefing')+b('Away summary')+'</div></section><section class="paper"><h2>Ready for your decision</h2>'+item('DRAFTS','2 replies prepared','Review the exact version before sending.',b('Review drafts',"show('Drafts')"))+item('MEMORY','1 Proposal','A launch date learned from a meeting.',b('Review Proposal',"show('Proposals')"))+'</section></div><details class="coverage"><summary>Source coverage incomplete · Slack refresh failed · Reader: Work Mac</summary>GitHub, Gmail and Calendar refreshed at 08:38.<br>Slack last succeeded yesterday at 17:12.<div class="row">'+b('Refresh now')+b('Connections',"show('Connections')")+'</div></details><div class="grid"><section><div class="row spread"><h2>Needs your attention</h2>'+b('Show dismissed')+'</div>'+item('REVIEW QUEUE · GITHUB','Review release checklist','acme/web #142 · Requested by Mira',primary('Open review',"show('Drafts')")+b('Done')+b('Dismiss')+b('Snooze'))+item('MEETINGS · 14:00','Project checkpoint','Launch readiness and remaining decisions.',b('View evidence'))+item('PENDING REPLIES · GMAIL','Confirm the launch window','Mira asks for a decision by Thursday.',b('Prepare draft'))+item('FACTS TO CHECK','Launch date needs checking','Review date passed on 16 November.',b('Open note',"show('Memory')"))+'</section><section><h2>Recently added</h2>'+item('CODEX · 09:12 · WITHOUT REVIEW','Launch owner','Owner changed from Jon to Mira after the planning session.',b('View change',"show('Memory')")+b('Revert'))+'<p class="muted secondary">Changes written without review in the last 7 days.</p></section></div>',
Drafts:()=>header('Drafts / 2 need review','Review before it leaves.','Approval belongs to one exact version. Editing creates a new version.')+'<div class="tabs">'+b('Needs review')+b('Finished')+b('All')+'</div><div class="split"><section class="list"><button class="selected">Release checklist review<small>GitHub comment · Draft v3</small></button><button onclick="demo(\'Second draft selected\')">Confirm launch window<small>Gmail draft · Draft v1</small></button></section><section class="paper"><div class="row spread"><span class="pill" id="draftstate">Draft · v3</span><small>GitHub / acme/web / PR #142</small></div><h2 class="section">Release checklist review</h2><div class="quote"><small>CONTEXT · PR #142</small><p>“Please check whether the rollback owner is clear before we merge.”</p>'+b('Open cited evidence')+'</div><label class="label" for="body">Comment text</label><textarea id="body" oninput="document.getElementById(\'draftstate\').textContent=\'Unsaved changes\';document.getElementById(\'approve\').disabled=true">The checklist covers the rollout steps. Please name Mira as the rollback owner and link the recovery runbook before merging.</textarea><div class="row section">'+b('Save new version',"saveDraft()")+'<button class="primary" id="approve" onclick="approveDraft()">Approve v3</button>'+b('Reject')+'</div><p class="muted secondary" id="approval">This has not been approved or sent.</p><details><summary>Version history</summary>v3 · Edited by you at 09:24<br>v2 · Edited by you at 09:20<br>v1 · Prepared from the review request</details></section></div>',
Memory:()=>header('Memory / Library','A Brain you can inspect.','Read current facts, follow their sources, and see what changed.')+'<div class="tabs">'+b('Library',"show('Memory')")+b('Proposals · 1',"show('Proposals')")+b('Recent saves',"demo('Recent saves include auto-accepted provenance and Revert')")+'</div><label for="search" class="label">Search memory and notes</label><input id="search" placeholder="Search by words or meaning" oninput="document.getElementById(\'searchnote\').textContent=this.value?\'Illustrative match: Launch plan · memory/projects/launch.md:12\':\'Matching by meaning and keywords\'"><p id="searchnote" class="muted secondary">Matching by meaning and keywords</p><div class="tabs">'+['People','Projects','Decisions','Notes','Imported','Evidence','Deliverables'].map(x=>b(x)).join('')+'</div><div class="split"><section class="list"><button class="selected">Launch plan<small>Project · Updated today</small></button><button>Rollback ownership<small>Decision · 14 November</small></button></section><section class="paper"><span class="eyebrow">Project / Read-only</span><h2>Launch plan</h2><small>memory/projects/launch.md</small><h3 class="section">Current state</h3><div class="facts"><strong>Owner</strong><span>Mira Chen<br><small>17 November · Codex session</small></span><strong>Launch date</strong><span>20 November <span class="pill">Unverified</span><br><small>Review date: 16 November</small></span></div><details open><summary>History</summary>17 November: Owner changed from Jon to Mira.<br>Reason: agreed in the planning session.</details><details><summary>Change log</summary>09:12 · Correction · Codex · Auto-accepted</details>'+b('Show the Markdown file')+'<p class="muted secondary">Make changes through your Harness or Markdown editor.</p></section></div>',
Proposals:()=>header('Memory / Proposals','One change to consider.','Read the complete change and its evidence before applying it.')+'<section class="paper"><div class="row spread"><span class="pill">Proposal · Work Mac</span>'+b('Back to library',"show('Memory')")+'</div><h2 class="section">Update launch plan</h2><p>Suggested after the launch planning meeting.</p><div class="facts"><strong>Launch date</strong><span><del>20 November</del> → <strong>24 November</strong><br><small>Reason: allow time for the recovery rehearsal.</small></span><strong>Review date</strong><span>23 November</span><strong>Event</strong><span>Team agreed to rehearse rollback before launch.</span><strong>Tags</strong><span>launch, operations</span></div><div class="quote">“Let us move launch to the 24th so Mira can run the recovery rehearsal first.”<br><small>evidence/captures/planning.md:28-30</small></div><div class="row">'+b('Read evidence')+primary('Apply complete Proposal')+b('Reject')+'</div></section>',
Jobs:()=>header('Jobs','Work keeps moving.','Research, briefings and drafts continue in the service when you close this page.')+'<label class="label" for="research">Research question</label><input id="research" value="What decisions remain before the launch?"><div class="row section">'+primary('Start research')+'</div><div class="split"><section class="list"><button class="selected">Launch decisions<small>Running · Research</small></button><button>Morning briefing<small>Completed · 08:40</small></button></section><section class="paper"><span class="pill">Running</span><h2 class="section">Launch decisions</h2><p>Reading related evidence</p><progress value="65" max="100" aria-label="Research progress"></progress><p>65% complete</p><details open><summary>Events</summary>09:28 · Started<br>09:28 · Found related notes<br>09:29 · Reading evidence</details>'+b('Cancel job')+'</section></div><details><summary>Diagnostics</summary>'+b('Start diagnostic job')+'</details>',
Connections:()=>header('Connections','Know what Attache can reach.','Permissions and refresh coverage are shown separately.')+'<h2>Work sources</h2>'+['Slack|Refresh failed|Read-only · Last success yesterday 17:12','GitHub|Ready|Read and approved comments · Last success 08:38','Gmail|Ready|Read and approved drafts · Last success 08:38','Google Calendar|Ready|Read-only · Last success 08:38','Jira|Not connected|Connect through your claude.ai connector or Atlassian','Confluence|Not connected|Read pages through your Atlassian connection'].map(s=>{let [n,status,d]=s.split('|');return '<details class="paper"><summary><strong>'+n+'</strong> · '+status+'</summary><p>'+d+'</p><div class="row">'+b('Configure')+b('Test connection')+b('Refresh now')+b('Disconnect')+'</div></details>'}).join('')+'<div class="cards section"><section class="paper"><h2>Harnesses</h2><p>Codex · Connected</p><p>Claude Code · Not connected</p><p>Antigravity · Not connected</p><p>Claude Desktop · Not connected</p>'+b('Manage Harnesses')+'</section><section class="paper"><h2>Notes and model</h2><p>Attache data folder · Ready</p>'+b('Import a folder')+'<p class="section">Claude Code model · Ready</p>'+b('Configure model')+'</section></div>',
Settings:()=>header('Settings','Your Brain, your rules.','Settings on this Machine, with Replication controls clearly identified.')+'<div class="split"><section class="list">'+['Features','Schedules and notifications','Identity','This Machine and Replication','Auto-accept and Consolidation','Meaning-based search','Paired clients','Backup and export','Service health'].map(n=>'<button onclick="demo(this.textContent)">'+n+'</button>').join('')+'</section><section class="paper"><span class="eyebrow">This Machine and Replication</span><h2>Work Mac</h2><label class="label" for="machine">Machine name</label><input id="machine" value="Work Mac"><p>'+b('Save name')+'</p><hr><h3>Replication</h3><span class="pill">Up to date</span><p>Last checked 09:30 · Last sent 09:29<br><small>Private repository: emil/attache-brain</small></p><div class="row">'+b('Check now')+b('Switch off')+'</div><h3 class="section">Machines</h3><p>Work Mac · Reader · Preferred Reader</p><p>Home Linux · Standby · Last changed yesterday</p>'+b('Manage Reader preferences')+'<p class="muted secondary">Source refresh coverage is available on Home and Connections.</p></section></div>',
Setup:()=>header('Setup / Step 1 of 5','Give your Brain a home.','Your knowledge stays as plain Markdown on this Machine.')+'<div class="tabs">'+['1 · Data folder','2 · Features','3 · Connections','4 · Model and schedules','5 · Test and finish'].map(x=>b(x)).join('')+'</div><section class="paper"><h2>Start with a folder</h2><label for="folder" class="label">Data folder</label><input id="folder" value="~/Documents/Attache"><p class="muted">Existing Markdown files are indexed and never modified.</p><div class="row">'+b('Preview folder')+primary('Use this folder')+'</div><details><summary>Already use Attache on another Machine?</summary>Join its Brain into an empty folder.<p>'+b('Join a Brain')+'</p></details><details><summary>Import existing notes (optional)</summary><label class="label" for="import">Folder to read</label><input id="import" placeholder="~/Documents/Notes">'+b('Preview import')+'</details><details><summary>Your identity (optional)</summary><label class="label" for="name">Name</label><input id="name"><label class="label" for="email">Email</label><input id="email" type="email"></details></section>'
};
let version=3;
function demo(s){document.getElementById('notice').textContent='Prototype only: '+s+' selected. No service data changed.'}
function show(name){document.getElementById('view').innerHTML=pages[name]();document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-current',x.dataset.page===name?'page':'false'));document.getElementById('notice').textContent='';window.scrollTo(0,0)}
function saveDraft(){version++;document.getElementById('draftstate').textContent='Draft · v'+version;let a=document.getElementById('approve');a.disabled=false;a.textContent='Approve v'+version;a.onclick=approveDraft;document.getElementById('approval').textContent='New version saved in this demo. Earlier approval is invalid.'}
function revokeDraft(){document.getElementById('draftstate').textContent='Revoked · v'+version;let a=document.getElementById('approve');a.textContent='Approve v'+version;a.onclick=approveDraft;document.getElementById('approval').textContent='Approval revoked in this demo.'}
function approveDraft(){document.getElementById('draftstate').textContent='Approved · v'+version;let a=document.getElementById('approve');a.textContent='Send approved v'+version;a.onclick=()=>{demo('Sending approved version '+version);a.disabled=true;document.getElementById('approval').textContent='Demo: awaiting verification. Production shows a receipt only after the service verifies the result.'};document.getElementById('approval').innerHTML='Version '+version+' approved in this demo. Nothing sent. '+b('Revoke approval',"revokeDraft()")}
document.getElementById('nav').innerHTML=['Home','Memory','Drafts','Jobs','Connections','Settings'].map(n=>'<button data-page="'+n+'" onclick="show(\''+n+'\')">'+({Home:'Inbox',Memory:'Brain'}[n]||n)+'</button>').join('');
// v2: unified decisions, explicit filtering and global read-only search.
const queueRows=[
['Attention','Review release checklist','GitHub · acme/web #142 · Draft v3 linked','Drafts'],
['Attention','Project checkpoint','Calendar · Today at 14:00','Memory'],
['Attention','Confirm the launch window','Gmail · Mira needs a reply Thursday · Draft v1 linked','Drafts'],
['Attention','Launch date needs checking','Review date passed on 16 November','Memory'],
['Proposals','Update launch plan','20 November to 24 November · Work Mac','Proposals'],
['Connections','Reconnect Slack','Sign-in expired · Pending replies may be missing','Connections']
];
let queueFilter='All';
const oldHome=pages.Home;
pages.Home=()=>header('Inbox / Tuesday, 17 November','Your day, in view.','6 decisions: 4 attention items, 1 Proposal and 1 sign-in. The 2 linked drafts are counted with their items.')+
'<section class="brief"><p>The launch review is waiting for your judgment. Mira needs a reply before Thursday.</p><div class="row">'+b('Read full briefing')+b('Prepare briefing')+b('Away summary')+b('Meeting context')+'</div></section><details class="coverage"><summary>Coverage incomplete: Slack needs sign-in · Reader: Work Mac</summary>Other connected sources refreshed at 08:38. Slack last succeeded yesterday at 17:12.</details><div class="grid"><section><label for="queuefilter">Show decisions</label><select id="queuefilter" onchange="queueFilter=this.value;renderQueue()">'+['All','Attention','Proposals','Drafts','Connections','Dismissed'].map(x=>'<option>'+x+'</option>').join('')+'<div id="queue"></div></section><section><h2>Recently added</h2>'+item('CODEX · WITHOUT REVIEW','Launch owner','Jon → Mira · Planning session, 09:12',b('View change',"show('Memory')")+b('Revert'))+'<p class="muted">Changes written without review in the last 7 days.</p>'+b('All changes in Brain',"show('Memory')")+'</section></div>';
function renderQueue(){const q=document.getElementById('queue');if(!q)return;q.innerHTML=queueRows.filter(r=>queueFilter==='All'||r[0]===queueFilter||(queueFilter==='Drafts'&&r[2].includes('linked'))).map(r=>'<details class="item"><summary><strong>'+r[1]+'</strong><br><small>'+r[0]+' · '+r[2]+'</small></summary><p>Review the evidence and exact consequence before deciding.</p>'+b('Open '+(r[3]==='Memory'?'Brain':r[3]),"show('"+r[3]+"')")+'</details>').join('')||'<p>No illustrative decisions in this category.</p>';}
const baseShow=show;
show=function(name){baseShow(name);if(name==='Home'){queueFilter='All';renderQueue();}};
const searchDialog=document.createElement('dialog');searchDialog.setAttribute('aria-label','Search the Brain');searchDialog.innerHTML='<form method="dialog"><button>Close search</button></form><h2>Search the Brain</h2><label for="globalquery">Search memory, evidence and deliverables</label><input id="globalquery" type="search" placeholder="Try launch" oninput="document.getElementById(\'globalresult\').hidden=!this.value.trim()"><p>Illustrative results · Matching keywords only</p><div id="globalresult" hidden><p>Launch plan · memory/projects/launch.md:12</p><button onclick="searchDialog.close();show(\'Memory\')">Open note</button></div>';document.body.append(searchDialog);
function openSearch(){searchDialog.showModal();document.getElementById('globalquery').focus();}
const searchButton=document.createElement('button');searchButton.textContent='Search Brain · Ctrl K';searchButton.onclick=openSearch;document.getElementById('nav').before(searchButton);
