<script>
const logoSvg="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"6 6 52 52\">\n  <title>Attache</title>\n  <mask id=\"cut\">\n    <rect width=\"64\" height=\"64\" fill=\"#fff\"/>\n    <rect x=\"0\" y=\"31\" width=\"64\" height=\"3\" fill=\"#000\"/>\n    <rect x=\"18\" y=\"28\" width=\"6\" height=\"9\" rx=\"2\" fill=\"#000\"/>\n    <rect x=\"40\" y=\"28\" width=\"6\" height=\"9\" rx=\"2\" fill=\"#000\"/>\n    <circle cx=\"51\" cy=\"19\" r=\"9\" fill=\"#000\"/>\n  </mask>\n  <g mask=\"url(#cut)\" fill=\"#ba6249\">\n    <path d=\"M25 20v-4a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v4\" fill=\"none\" stroke=\"#ba6249\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n    <rect x=\"8\" y=\"19\" width=\"48\" height=\"33\" rx=\"7\"/>\n  </g>\n  <circle cx=\"51\" cy=\"19\" r=\"6\" fill=\"#c38942\"/>\n</svg>\n";
const $=id=>document.getElementById(id), pages=['Home','Approvals','Brain','Connections','Jobs','Settings'];
const paths={search:'M15 15l6 6 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',review:'M6 7v10 M18 7v3q0 4-6 4H7 M6 3a2 2 0 1 0 .1 0 M6 17a2 2 0 1 0 .1 0 M18 3a2 2 0 1 0 .1 0',reply:'M3 6h18v13H3z M3 6l9 7 9-7',issue:'M4 4h16v16H4z M8 9h8 M8 14h5',mention:'M16 8v7q4 3 5-3a9 9 0 1 0-4 8 M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0',time:'M12 3a9 9 0 1 1-.1 0 M12 7v6l4 2',check:'M3 12l6 6L21 5',sun:'M3 17h18 M6 14a6 6 0 0 1 12 0 M12 2v3 M3 6l3 2 M21 6l-3 2',calendar:'M3 6h18v15H3z M3 10h18 M7 3v5 M17 3v5'};
function icon(k){return '<svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="'+paths[k]+'"/></svg>'}
const base=[
['Review request','review','blue','Review the fallback for delayed invoices','GitHub · ledger / payments #482','09:12'],
['Pending reply','reply','rust','Confirm the pilot window with Nora','Gmail · Nora Lind · View draft','08:56'],
['Assigned issue','issue','green','Trace duplicate receipts in staging','GitHub · ledger / billing #91','08:44'],
['Slack mention','mention','plum','Mira needs the revised launch checklist','Slack · #pilot-rollout','08:32']];

let meeting=false,issue=false,heavy=false,hidden=new Set(),done=new Set(),approved='draft',proposal=true,proposalResult='',filter='All types',page;
const meetings=['Pilot handover','Billing triage'];const openMeet=i=>meeting&&!done.has('m'+i);
function data(){let rows=[...base,...(heavy?more:[])].map((r,i)=>[...r.slice(0,5),r[5]||'Yesterday',String(i)]);meetings.forEach((t,i)=>{if(openMeet(i)&&hidden.has('m'+i))rows.push(['Meeting prep','calendar','blue',t,'Google Calendar','Today','m'+i])});if(approved==='succeeded')rows[1][4]='Gmail · Nora Lind';return rows.filter(r=>!done.has(r[6]))}
function brief(){return !meeting&&!localStorage.getItem('attache-demo-brief-20261118')&&!hidden.has('b')}
function counts(){return {Home:data().length+meetings.filter((_,i)=>openMeet(i)&&!hidden.has('m'+i)).length+Number(brief()),Approvals:Number(['approved','draft','revoked'].includes(approved))+Number(proposal),Connections:Number(issue)}}
function links(){return pages.map(p=>'<a href="#'+p+'" '+(page===p?'aria-current="page"':'')+'>'+p+(counts()[p]?'<b>'+counts()[p]+'</b>':'')+'</a>').join('')}
function openDialog(title,content){$('dlg').innerHTML='<div class="pair"><h2 id="dt">'+title+'</h2><button onclick="dlg.close()">Close</button></div>'+content;if(!$('dlg').open)$('dlg').showModal()}
function palette(){if(page==='Home'){if(dlg.open)dlg.close();$('query').focus();return}openDialog('Search the Brain',searchBox());$('query').focus()}function menu(){openDialog('Navigation','<nav style="display:block">'+links()+'</nav><button onclick="palette()">Search the Brain</button>')}
function controls(){openDialog('Prototype scene',[
['Theme','Light','Dark',document.documentElement.classList.contains('dark'),"document.documentElement.classList.toggle('dark',this.selectedIndex===1)"],
['Time','Morning','Meeting in progress',meeting,'meeting=!!this.selectedIndex'],['Connections','All good','Sign-in needed',issue,'issue=!!this.selectedIndex'],['Inbox','Typical day','Heavy day',heavy,'heavy=!!this.selectedIndex']].map(([l,a,b,s,h])=>'<label>'+l+'<select onchange="'+h+';render()"><option>'+a+'</option><option '+(s?'selected':'')+'>'+b+'</option></select></label>').join(''))}
function row(r){return '<article class="row"><span class="type" style="--c:var(--'+r[2]+')"><span class="stamp">'+icon(r[1])+'</span>'+r[0]+'</span><div><a class="title" href="#item/'+r[6]+'">'+r[3]+'</a><p>'+r[4]+'</p></div><time>'+r[5]+'</time></article>'}
function heads(){let cards='';if(brief())cards='<article class="hero"><div class="tag">'+icon('sun')+' Morning briefing</div><h3 class="big">The pilot is ready for review.</h3><p>Nora confirmed the launch window. The invoice fallback still needs your review.</p><div class="actions"><button class="primary" onclick="briefDetail()">Read briefing</button><button class="plain" onclick="localStorage.setItem(\'attache-demo-brief-20261118\',1);render()">Got it</button><button class="plain" onclick="hideHead(\'b\')">Not now</button><small>Morning schedule · Until noon</small></div></article>';meetings.forEach((t,i)=>{if(openMeet(i)&&!hidden.has('m'+i))cards+='<article class="hero"><div class="tag">'+icon('calendar')+' Meeting prep</div><h3 class="big">'+t+'</h3><p>'+(i?'Starts at 14:30 · Here until 15:00':'In progress, ends 14:30')+' · On your calendar</p><div class="actions"><a class="primary event" href="https://meet.google.com/abc-defg-hij" onclick="event.preventDefault();eventDetail('+i+',true)">Join</a><a href="https://calendar.google.com/calendar/event?eid=demo'+i+'" onclick="event.preventDefault();eventDetail('+i+',false)">Calendar event</a><button onclick="decide(\'m'+i+'\')">Done</button><button class="plain" onclick="hideHead(\'m'+i+'\')">Not now</button></div></article>'});return cards?'<section><h2>For you now</h2>'+cards+'</section>':'<p class="meta" style="margin-top:16px">For you now · No timely Heads-up</p>'}
function hideHead(k){hidden.add(k);render();$('main').focus();$('live').textContent=k==='b'?'Briefing hidden':'Meeting prep moved to Inbox'}function decide(k){done.add(k);location.hash='Home';render()}
function eventDetail(i,call){openDialog(call?'Join '+meetings[i]:meetings[i],'<p>Google Calendar · '+(i?'14:30 to 15:00':'14:00 to 14:30')+'</p><p>This sample event has no live Meet call.</p>')}
function briefDetail(){openDialog('Morning briefing','<p>Nora confirmed the November pilot window.</p><p>Your review is needed on the invoice fallback.</p><p>A reply to Nora is ready to review.</p><p><a href="#item/0">1 review request</a> · <a href="#Approvals">Open Approvals</a></p>')}
function searchBox(){return '<label class="search">'+icon('search')+'<input id="query" type="search" aria-label="Search the Brain" placeholder="Find a person, project or decision..." oninput="results(this.value)"><kbd>Ctrl K</kbd></label><div id="result"></div>'}
function results(q){let hits=['Pilot rollout','Nora Lind','Invoice fallback'].filter(x=>x.toLowerCase().includes(q.trim().toLowerCase()));$('result').innerHTML=q.trim()?hits.map(x=>'<a href="#note/'+encodeURIComponent(x)+'">'+x+' · Current state</a>').join('')||'<p>No matching passages.</p>':''}
function home(){let rows=data(),opts=['All types',...new Set(rows.map(r=>r[0]))];if(!opts.includes(filter))filter=opts[0];return '<div class="date">Home &nbsp;/&nbsp; Wednesday, 18 November</div><h1>Search the Brain</h1>'+searchBox()+heads()+'<div class="status '+(issue?'problem':'')+'">'+icon(issue?'issue':'check')+'<strong>Connections</strong> '+(issue?'Gmail needs sign-in':'All working')+'<a href="#Connections">View details ↗</a></div><section><div class="pair"><h2>Inbox <span class="count">'+rows.length+'</span></h2><select aria-label="Filter Inbox by type" onchange="filter=this.value;render();document.querySelector(\'main select\').focus()">'+opts.map(o=>'<option '+(o===filter?'selected':'')+'>'+o+'</option>').join('')+'</select></div><div class="rows">'+rows.filter(r=>filter===opts[0]||filter===r[0]).map(row).join('')+'</div></section><section><h2>Recently added</h2><p class="panel">No unreviewed changes in the last seven days.</p><button onclick="openDialog(\'Away summary\',\'<p>Last three days · The pilot window was confirmed and the fallback opened for review.</p>\')">Away summary</button></section>'}
const panel=(title,body)=>'<article class="panel"><h3>'+title+'</h3>'+body+'</article>';
function sub(){let [p,id]=page.split('/');if(p==='item'){let r=data().find(r=>r[6]===id);return r?'<h1>'+r[0]+'</h1>'+panel(r[3],'<p>'+r[4]+'</p><p>Evidence · '+r[4].split(' · ')[0]+' activity on 18 November</p>'+(id==='1'?(approved==='succeeded'?'<button onclick="approved=\'draft\';location.hash=\'Draft\'">Prepare draft</button> ':'<a href="#Draft">View draft</a> '):'')+'<button onclick="decide(\''+id+'\')">Done</button>'):'<h1>Item closed</h1>'}
if(p==='Approvals')return '<h1>Approvals</h1><h2>Waiting for you <span class="count">'+counts().Approvals+'</span></h2>'+(approved!=='succeeded'?panel('Draft · Confirm the pilot window','<p>Gmail to Nora Lind · '+(approved==='approved'?'Approved, ready to send':'Version 2 needs approval')+'</p><a href="#Draft">Review draft →</a>'):'')+(proposal?panel('Proposal · Pilot rollout','<p>Change the rollout owner from Sam to Nora.</p><a href="#Proposal">Review change →</a>'):'')+'<h2>Finished</h2><p class="panel">'+(approved==='succeeded'?'Sent · Confirm the pilot window<br>':'')+(!proposal?proposalResult+' · Pilot rollout<br>':'')+'Rejected · Invite to the planning session</p>';
if(p==='Draft')return '<a href="#Approvals">← Approvals</a><h1>Confirm the pilot window</h1>'+panel('Draft v2 · Gmail','<p>To Nora Lind · Re: November pilot</p><blockquote>Thursday works for our team. I will share the fallback review before the handover.</blockquote><p>Evidence · Pilot rollout, Current state · Nora’s message at 08:56</p><button class="primary" '+(approved==='succeeded'?'disabled':'')+' onclick="approved=approved===\'draft\'?\'approved\':\'succeeded\';render()">'+({draft:'Approve v2',approved:'Send approved v2',succeeded:'Sent · Receipt received'}[approved])+'</button>');
if(p==='Proposal')return '<a href="#Approvals">← Approvals</a><h1>Pilot rollout</h1>'+panel('Proposal · Correction','<p>Owner · <del>Sam</del> → Nora</p><p>Nora took responsibility during handover.</p><blockquote>“I will own the pilot from Thursday.”</blockquote><p>Meeting capture · Lines 41-42 · Work Mac</p><button onclick="proposal=false;proposalResult=this.textContent===\'Apply\'?\'Applied\':\'Rejected\';location.hash=\'Approvals\'">Apply</button> <button onclick="proposal=false;proposalResult=this.textContent===\'Apply\'?\'Applied\':\'Rejected\';location.hash=\'Approvals\'">Reject</button>');
if(p==='Brain')return '<h1>Brain</h1>'+panel('Projects','<a href="#note/Pilot rollout">Pilot rollout</a><p>Current state · Updated yesterday</p>')+panel('People','<a href="#note/Nora Lind">Nora Lind</a>')+panel('Recent saves','<p>Yesterday · Pilot rollout · Owner confirmed by Emil</p>');
if(p==='note')return '<a href="#Brain">← Brain</a><h1>'+(['Pilot rollout','Nora Lind','Invoice fallback'].find(x=>x===decodeURIComponent(id))||'Note')+'</h1>'+panel('Current state','<p>17 November · Pilot launch is scheduled for Thursday.</p><p>Evidence · Pilot handover, lines 12-16</p>')+panel('History','<p>12 November · Launch window under review.</p>');
if(p==='Connections')return '<h1>Connections</h1>'+panel('Source refresh','<p>Reader · Work Mac · Last checked 09:15</p>')+panel('Gmail',issue?'<p>Sign-in needed · The last read failed.</p><button onclick="issue=false;render()">Reconnect</button>':'<p>Working · Complete at 09:14</p>')+panel('GitHub','<p>Working · Complete at 09:15</p>')+panel('Harnesses','<p>Codex · Connected to this Machine</p>');
if(p==='Jobs')return '<h1>Jobs</h1>'+panel('Source refresh','<p>Finished · GitHub · 09:15</p>')+panel('Morning briefing','<p>Finished · Work Mac · 08:00</p>');
return '<h1>Settings</h1>'+panel('This Machine','<p>Work Mac · Reader</p>')+panel('Meaning-based search','<p>Ready · Ranking by meaning and keywords</p>')+panel('Replication','<p>Up to date · Last checked 09:15</p>')}
function render(){page=decodeURI(location.hash.slice(1)||'Home');let n=Object.values(counts()).reduce((a,b)=>a+b,0);document.title=(n?'('+n+') ':'')+page.split('/')[0]+' | Attache';let src='data:image/svg+xml,'+encodeURIComponent(n?logoSvg:logoSvg.replace('<circle cx="51" cy="19" r="6" fill="#c38942"/>',''));$('logo').src=$('fav').href=src;document.querySelector('.brand').ariaLabel='Attache Home, '+n+' decisions';$('nav').innerHTML=links()+(page==='Home'?'':'<button onclick="palette()" aria-label="Search the Brain">'+icon('search')+'</button>');$('main').innerHTML=page==='Home'?home():sub()}
onhashchange=()=>{if(dlg.open)dlg.close();render();$('main').focus();scrollTo(0,0)};onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(dlg.open)dlg.close();palette()}};const scene=new URLSearchParams(location.search);document.documentElement.classList.toggle('dark',scene.has('dark'));meeting=scene.has('meeting');issue=scene.has('problems');heavy=scene.has('heavy');render()
