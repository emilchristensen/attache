<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  TEST-ONLY. Chrome for the browser journeys on Linux reads this through
  FONTCONFIG_FILE (tests/e2e/fonts.ts): the system's fonts as usual, plus the
  Gelasio faces beside this file standing in for "Georgia". Linux has no
  Georgia, so without this the Dashboard's headings fall back to a narrower
  serif and layout bugs that macOS and Windows show pass on Linux.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <match target="pattern">
    <test name="family" qual="any"><string>Georgia</string></test>
    <edit name="family" mode="assign" binding="same"><string>Gelasio</string></edit>
  </match>
</fontconfig>
